<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - FreshFarm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        :root {
            --primary-green: #008a4f;
        }

        body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-card {
            max-width: 450px;
            width: 100%;
            border-radius: 16px;
        }

        .logo-fallback {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0, 138, 79, .12);
            color: var(--primary-green);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
        }

        .btn-success {
            background: var(--primary-green);
            border-color: var(--primary-green);
        }

        .btn-success:hover {
            background: #006a3d;
            border-color: #006a3d;
        }

        .form-floating > .form-control:focus ~ label {
            color: var(--primary-green);
        }

         .form-control:focus {
             border-color: var(--primary-green);
             box-shadow: 0 0 0 .25rem rgba(0, 138, 79, .25);
         }

         .field-validation-error {
             display: block;
             margin-top: .5rem;
         }

         .validation-summary-errors ul {
             margin: 0;
             padding-left: 0;
             list-style: none;
         }

        .divider-text {
            position: relative;
            text-align: center;
            margin: 15px 0;
        }

        .divider-text span {
            padding: 0 8px;
            font-size: 12px;
            position: relative;
            z-index: 2;
            background: #fff;
            color: #6c757d;
            letter-spacing: .08em;
        }

        .divider-text::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 1px;
            background: #ddd;
            left: 0;
            top: 50%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="card border-0 shadow-sm p-4 login-card">
        <div class="card-body">
            <div class="text-center mb-4">
                <img id="signinLogo"
                     src="/uploads/web/logo.PNG"
                     alt="Logo FreshFarm"
                     style="max-height: 70px"
                     data-fallback-toggle-target="signinLogoFallback" />
                <div id="signinLogoFallback" class="logo-fallback d-none">
                    <i class="bi bi-basket2-fill"></i>
                </div>
                <h3 class="fw-bold mt-3">Chào mừng trở lại!</h3>
                <p class="text-muted mb-0">Đăng nhập để tiếp tục.</p>
            </div>

             <form method="post" class="needs-validation" novalidate action="/account/signin">
                 






                 <div class="text-danger small mb-3 validation-summary-errors"><ul><li>T&#xE0;i kho&#x1EA3;n ho&#x1EB7;c m&#x1EAD;t kh&#x1EA9;u kh&#xF4;ng &#x111;&#xFA;ng. B&#x1EA1;n c&#xF2;n 3 l&#x1EA7;n th&#x1EED; tr&#x1B0;&#x1EDB;c khi t&#xE0;i kho&#x1EA3;n b&#x1ECB; kh&#xF3;a t&#x1EA1;m th&#x1EDD;i.</li>
</ul></div>

                <div class="mb-3">
                    <div class="form-floating">
                        <input class="form-control" placeholder="Tên đăng nhập hoặc email" autocomplete="username" required type="text" data-val="true" data-val-length="T&#xEA;n &#x111;&#x103;ng nh&#x1EAD;p ho&#x1EB7;c email t&#x1ED1;i &#x111;a 100 k&#xFD; t&#x1EF1;." data-val-length-max="100" data-val-required="T&#xEA;n &#x111;&#x103;ng nh&#x1EAD;p ho&#x1EB7;c email kh&#xF4;ng &#x111;&#x1B0;&#x1EE3;c &#x111;&#x1EC3; tr&#x1ED1;ng." id="Identifier" maxlength="100" name="Identifier" value="notifverify0323125000" />
                        <label for="Identifier">Tên đăng nhập hoặc email</label>
                        <div class="invalid-feedback">Tên đăng nhập hoặc email không được để trống.</div>
                    </div>
                    <span class="text-danger small d-block mt-2 field-validation-valid" data-valmsg-for="Identifier" data-valmsg-replace="true"></span>
                </div>

                <div class="mb-3">
                    <div class="form-floating">
                        <input class="form-control" type="password" placeholder="Mật khẩu" autocomplete="current-password" required data-val="true" data-val-length="M&#x1EAD;t kh&#x1EA9;u t&#x1ED1;i &#x111;a 100 k&#xFD; t&#x1EF1;." data-val-length-max="100" data-val-required="M&#x1EAD;t kh&#x1EA9;u kh&#xF4;ng &#x111;&#x1B0;&#x1EE3;c &#x111;&#x1EC3; tr&#x1ED1;ng." id="Password" maxlength="100" name="Password" />
                        <label for="Password">Mật khẩu</label>
                        <div class="invalid-feedback">Mật khẩu không được để trống.</div>
                    </div>
                    <span class="text-danger small d-block mt-2 field-validation-valid" data-valmsg-for="Password" data-valmsg-replace="true"></span>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe" disabled />
                        <label class="form-check-label" for="rememberMe">Ghi nhớ đăng nhập</label>
                    </div>
                    <a class="small text-decoration-none" href="/account/forgot-password">Quên mật khẩu?</a>
                </div>

                <div class="d-grid">
                    <button class="btn btn-success btn-lg" type="submit">Đăng nhập</button>
                </div>

                <p class="divider-text"><span>HOẶC</span></p>

                <div class="d-grid gap-2">
                        <a class="btn btn-danger btn-lg" href="/account/signin/google">
                            <i class="bi bi-google me-2"></i> Đăng nhập với Google
                        </a>
                </div>
            <input name="__RequestVerificationToken" type="hidden" value="CfDJ8JhZfa4YInFJoWMPQSjpVYsLMt1IYI_T7KD6X50JW8WstkY8shPhaG3_ZEsBnuZcQeuvl-XFA_8KYayv_QnViK3rK0XWT7pT_wZPYV-T8N9DeHO3ngb5NU34WpXlHDDlDXjCUdaQDaM5S0kDmGdhDrs" /></form>

            <p class="text-center mt-4 mb-0 text-muted">
                Chưa có tài khoản?
                <a class="fw-bold text-decoration-none" style="color: var(--primary-green)" href="/account/signup">Đăng ký ngay</a>
            </p>
        </div>
    </div>

    <script src="/lib/jquery-validation/dist/jquery.validate.min.js"></script>
<script src="/lib/jquery-validation-unobtrusive/jquery.validate.unobtrusive.min.js"></script>

    <script nonce="m6GgR6pusxFdGzUSfmkndQ==" src="/js/csp-phase2.js?v=AFkDTLjBpvU_JG7I2UUSQ3jIkrPRfMWUyHhXDmMKbmU"></script>
    <script nonce="m6GgR6pusxFdGzUSfmkndQ==" src="/js/account-lockout-countdown.js?v=DTEBPrvfjGbfJ_jGQafIDeJGEZtAoIQ3A78XMqzGIo0"></script>
</body>
</html>
